name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-once.txt
      - run: python -m pip install -r requirements-once.txt
      - run: python -m py_compile netease_to_apple_music.py tests/test_netease_to_apple_music.py
      - run: python -m unittest discover -s tests -v
